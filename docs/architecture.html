function openAR(){tree('audience reaction',[[375,['Search similar Shorts','Real viewer comments','Group by theme'],'past comment themes','chat'],
  [525,['Find topics','Claude web search'],'current community talk','globe']])}
function close(){timers.forEach(clearTimeout);cancelAnimationFrame(raf);detS.classList.add('hide');topS.classList.remove('hide')}
const inD=()=>!detS.classList.contains('hide');
addEventListener('keydown',e=>{const k=e.code,fwd=k==='ArrowRight'||k==='Space'||k==='PageDown',back=k==='ArrowLeft'||k==='PageUp';
 if(k==='Escape'||k==='Backspace')close();
 else if(fwd||back){e.preventDefault();
  if(inD()){if(fwd?D.cur>=D.seq.length-1:D.cur<=0)close();else go(D.seq,D,renderD,fwd?1:-1);return}
  const nx=PH[M.cur+1];if(fwd&&nx&&nx[0]==='o'){cancelAnimationFrame(raf);M.cur++;render(M.cur,1);nx[1][0]==='rp'?openRP():openAR()}else go(PH,M,render,fwd?1:-1)}});
const q=new URLSearchParams(location.search);if(q.get('step')!=null){M.cur=+q.get('step');render(M.cur,+(q.get('u')||1))}if(q.get('view')==='rp')openRP();else if(q.get('view')==='ar')openAR();
